name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android platform and build tools
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found; ANDROID_HOME=$ANDROID_HOME"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve release tag
        id: tag
        run: echo "value=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build phone debug APK
        run: ./gradlew --no-daemon assemblePhoneDebug --stacktrace

      - name: Build carauto debug APK
        run: ./gradlew --no-daemon assembleCarautoDebug --stacktrace

      - name: Package APKs and checksums
        run: |
          mkdir -p dist
          TAG="${{ steps.tag.outputs.value }}"
          cp app/build/outputs/apk/phone/debug/app-phone-debug.apk  "dist/SunnyNavCompanion-phone-${TAG}.apk"
          cp app/build/outputs/apk/carauto/debug/app-carauto-debug.apk "dist/SunnyNavCompanion-carauto-${TAG}.apk"
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          ls -lh

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: SunnyNavCompanion ${{ steps.tag.outputs.value }}
          files: |
            dist/SunnyNavCompanion-phone-${{ steps.tag.outputs.value }}.apk
            dist/SunnyNavCompanion-carauto-${{ steps.tag.outputs.value }}.apk
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
