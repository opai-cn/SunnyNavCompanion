name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android platform and build tools
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found; ANDROID_HOME=$ANDROID_HOME"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check bridge script syntax
        run: python3 -m py_compile bridge/nav_bridge.py

      - name: Build phone debug APK
        run: ./gradlew --no-daemon assemblePhoneDebug --stacktrace

      - name: Build carauto debug APK
        run: ./gradlew --no-daemon assembleCarautoDebug --stacktrace

      - name: Upload phone debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SunnyNavCompanion-phone-debug
          path: app/build/outputs/apk/phone/debug/app-phone-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload carauto debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SunnyNavCompanion-carauto-debug
          path: app/build/outputs/apk/carauto/debug/app-carauto-debug.apk
          if-no-files-found: error
          retention-days: 14
